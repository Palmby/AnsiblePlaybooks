- name: Join PC to on-prem AD domain
  hosts: windows_clients
  gather_facts: false
  vars:
    domain_name: #input domain name here
    domain_admin_user: #input domain admin user here (hint: use \\ when specifying domain)
    domain_admin_password: #input domain user password 
    domain_ou_path: "OU=Workstations,DC=corp,DC=example,DC=com"  # optional
  tasks:
    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name: "{{ domain_name }}"
        domain_admin_user: "{{ domain_admin_user }}"
        domain_admin_password: "{{ domain_admin_password }}"
        domain_ou_path: "{{ domain_ou_path }}"
        state: domain
      register: domain_join

    - name: Reboot if join changed state
      ansible.windows.win_reboot:
      when: domain_join.reboot_required
