- name: Enable RDP without Network Level Authentication
  hosts: all
  gather_facts: false

  tasks:
    - name: Enable Remote Desktop (fDenyTSConnections = 0)
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server
        name: fDenyTSConnections
        data: 0
        type: dword

    - name: Disable Network Level Authentication (UserAuthentication = 0)
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp
        name: UserAuthentication
        data: 0
        type: dword

    - name: Allow Remote Desktop through Windows Firewall
      community.windows.win_firewall_rule:
        name: "Remote Desktop - User Mode (TCP-In)"
        enabled: true
        state: present
        action: allow

    - name: Ensure Remote Desktop service is running
      ansible.windows.win_service:
        name: TermService
        start_mode: auto
        state: started

